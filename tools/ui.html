<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="board-token" content="">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看板</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/assets/board.png">
<style>
:root{
  --bg:#0e1014; --panel:#15181e; --card:#1b1f27; --line:#2a303a;
  --fg:#e8eaed; --mut:#8b94a1; --acc:#5aa9ff; --ok:#3fb950; --warn:#d9a441; --err:#f85149;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;transition:.15s}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{background:#252b35;color:var(--fg)}
.btn:hover:not(:disabled){background:#2f3742}
.btn-primary{background:var(--acc);color:#06121f;font-weight:600}
.btn-primary:hover:not(:disabled){background:#7dbcff}
.btn-ok{background:#1d5f33;color:#c6ffd8}
.btn-ok:hover:not(:disabled){background:#25753f}
.btn-err{background:#5f1d1d;color:#ffd0d0}
.btn-err:hover:not(:disabled){background:#7a2626}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:10;flex-wrap:wrap;row-gap:8px}
#proj{max-width:200px}
#projinfo{max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
header button{padding:8px 14px;white-space:nowrap}
h1{font-size:16px;font-weight:600}
.sub{color:var(--mut);font-size:12px}
.spacer{flex:1}
select,input,textarea{background:#11141a;color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;font:inherit;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px;width:100%}
main{padding:18px 22px 60px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:92px}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{color:var(--mut);font-size:11px}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}
/* 状态筛选条：8 列在 1360px 里塞不下，以前「拍板中」列默认在屏幕外要拖动才看得见。
   现在默认只画**有卡的列**，顶部按状态筛。 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#14171d;border:1px solid var(--line);color:var(--mut);border-radius:999px;
  padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.chip em{color:#6c7683;font-style:normal;margin-left:5px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:#39424f;color:var(--fg)}
.chip.on{background:#1b2431;border-color:#3b5b8a;color:#cfe0ff}
.chip.on em{color:#8fa9cc}
/* 多选（批量跑 / 批量取消）：卡片右上角小方框；选中后底部浮出一条操作栏 */
.card .pick{position:absolute;right:9px;top:9px;width:15px;height:15px;cursor:pointer;
  accent-color:#4c8bf5;opacity:.45;transition:opacity .15s}
.card:hover .pick,.card.sel .pick{opacity:1}
.card.sel{border-color:#3b5b8a;box-shadow:inset 0 0 0 1px #3b5b8a}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;
  align-items:center;gap:10px;background:#1a2029;border:1px solid #2f3a48;border-radius:12px;
  padding:10px 14px;box-shadow:0 12px 40px #000a;z-index:60;font-size:13px}
.selbar b{color:#cfe0ff;font-size:15px}
.selbar .spacer{width:22px}
.selbar.hide{display:none}
/* 搜卡：卡一多就靠它找，别逼人一列列扫 */
.search{width:190px;background:#11141a;border:1px solid var(--line);border-radius:8px;
  color:var(--fg);font-size:12px;padding:7px 10px;font-family:inherit}
.search:focus{outline:none;border-color:#3b5b8a}
.card .ago{font-size:11px;color:#6c7683;margin-left:6px;font-weight:400}
.card .ago.stale{color:#c98b3a}
/* 卡片详情里的实时输出 */
.clog{background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:10px;
  font-size:11px;line-height:1.6;max-height:220px;overflow:auto;white-space:pre-wrap;
  font-family:ui-monospace,Consolas,monospace;color:#b8c1cd;margin:6px 0 12px}
/* 长字段折叠（凭据动辄几百字，默认收起才看得见下面的东西） */
.foldbtn{margin-left:8px;background:#1d2530;border:1px solid #2f3a48;color:#9fb8e0;
  border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;font-family:inherit;
  vertical-align:baseline}
.foldbtn:hover{border-color:#3b5b8a;color:#cfe0ff}
.col{flex:0 0 268px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.col h2{font-size:13px;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;
  justify-content:space-between;color:#c8d0da}
.col h2 em{color:var(--mut);font-style:normal}
.col body,.col .list{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;position:relative}
.card:hover{border-color:#3c4757;background:#20252e}
.card .id{font-size:11px;color:var(--acc);font-family:ui-monospace,Consolas,monospace}
.card .t{font-weight:600;margin:3px 0 6px;font-size:13px;line-height:1.45}
.card .g{color:var(--mut);font-size:12px;margin-bottom:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;font-size:10px}
.tag{padding:1px 7px;border-radius:20px;background:#252b35;color:#a9b4c4}
.tag.gate{background:#3d2f18;color:#f0c98a}
.tag.rw{background:#3d1c1c;color:#ff9c9c}
.tag.ai{background:#173d28;color:#8cffb4}
.tag.cost{background:#20283a;color:#9fb8e0}
.tag.proj{background:#2c2450;color:#c4b5fd}
.empty{color:#39414d;text-align:center;padding:14px;font-size:12px}
dialog{border:none;border-radius:14px;background:var(--panel);color:var(--fg);
  padding:0;width:min(680px,92vw);max-height:92vh;box-shadow:0 20px 60px #000a}
dialog::backdrop{background:#000b}
.dhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dbody{padding:16px 20px;overflow:auto;max-height:calc(92vh - 128px)}
.dfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;
  flex-wrap:wrap}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
label:first-child{margin-top:0}
.row{display:flex;gap:10px}
.row>*{flex:1}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:13px;margin:10px 0}
.kv dt{color:var(--mut)}
.kv dd{word-break:break-word}
.ev{font-size:12px;border-left:2px solid var(--line);padding:4px 0 4px 12px;margin:8px 0;color:#b8c1cd}
.ev b{color:var(--fg)}
/* 拍板 diff（B4）：一行一个交付物，颜色区分「新增/改了/没动/没了」 */
.difflist{margin:6px 0 14px}
.diffrow{display:flex;gap:10px;align-items:baseline;font-size:12px;padding:4px 8px;
  border-left:2px solid var(--line);margin:4px 0}
.diffrow b{min-width:34px}
.diffrow code{color:#c9d4e0}
.diffrow span{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
.diffrow.ok{border-left-color:#2f7d4f}
.diffrow.chg{border-left-color:#b98a2a}
.diffrow.bad{border-left-color:#8c3232}
.diffrow.same{opacity:.55}
.toast{position:fixed;right:20px;bottom:20px;background:#1f2731;border:1px solid var(--line);
  border-radius:10px;padding:12px 18px;box-shadow:0 10px 30px #000a;opacity:0;transform:translateY(10px);
  transition:.2s;max-width:420px;z-index:99}
.toast.show{opacity:1;transform:none}
.toast.err{border-color:#6b2b2b;background:#2a1a1a}
.hint{color:var(--mut);font-size:12px;margin-top:6px}
.log{background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:12px;
  font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;
  max-height:240px;overflow:auto;color:#a9b4c4}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;background:#252b35;font-size:11px;color:#a9b4c4}

/* ---- 留言 ---- */
.badge{display:none;background:var(--acc);color:#06121f;font-weight:700;border-radius:20px;
  padding:0 6px;margin-left:7px;font-size:11px}
.badge.on{display:inline-block}
.msglist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;
  background:#11141a;padding:6px;margin-bottom:6px}
.msg{border-bottom:1px solid #1f242c;padding:9px 8px}
.msg:last-child{border-bottom:none}
.msg .mh{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--mut)}
.msg .mh b{color:var(--acc);font-weight:600}
.msg .mb{margin-top:4px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.msg.unread{background:#151d28;border-left:2px solid var(--acc);border-radius:6px}
.msg .ma{float:right;font-size:11px;padding:3px 9px;border-radius:6px;background:#252b35;color:#a9b4c4;cursor:pointer}
.msg .wake{font-size:10px;color:#7f8a99;border:1px solid #2a303a;border-radius:20px;padding:0 7px}

/* ---- 内置终端 ---- */
.term{position:fixed;left:0;right:0;bottom:0;height:320px;background:#0b0d11;
  border-top:1px solid var(--line);display:flex;flex-direction:column;z-index:40;
  box-shadow:0 -12px 40px #000a}
.term.hide{display:none}
.term .thead{display:flex;align-items:center;gap:8px;padding:7px 12px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.term .thead b{font-size:12px;font-weight:600}
.term .thead button{padding:4px 10px;font-size:12px;border-radius:6px}
.term .tout{flex:1;overflow:auto;margin:0;padding:10px 14px;font-family:ui-monospace,Consolas,monospace;
  font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#a9b4c4}
.term .tout .ok{color:#3fb950}
.term .tout .err{color:#f85149}
.term .tout .head{color:#5aa9ff}
.term .tout:empty::before{content:"还没有输出 —— 点上面的按钮，或直接敲命令（只跑看板自己那几条）";color:#39414d}
.term .tin{display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-top:1px solid var(--line);background:var(--panel)}
.term .tin .ps{color:var(--acc);font-family:ui-monospace,Consolas,monospace}
.term .tin input{flex:1;border:none;background:transparent;font-family:ui-monospace,Consolas,monospace;
  font-size:12px;padding:4px 0}
.term .tin input:focus{border:none}
body.term-on main{padding-bottom:340px}
body.term-on .toast{bottom:340px}

</style>
</head>
<body>

<header>
  <h1>看板</h1>
  <select id="proj" title="切换项目"></select>
  <span class="sub" id="projinfo"></span>
  <div class="spacer"></div>
  <input id="search" class="search" placeholder="搜卡号 / 标题 / 目标" title="输入即过滤（Esc 清空）">
  <select id="sort" class="search" style="width:118px" title="列内排序">
    <option value="activity">按最近活动</option>
    <option value="cost">按花费</option>
    <option value="minutes">按时长</option>
    <option value="id">按卡号</option>
  </select>
  <button class="btn" id="btn-msg">留言<span class="badge" id="msg-badge"></span></button>
  <button class="btn" id="btn-term" title="Ctrl+` 开合">终端</button>
  <button class="btn" id="btn-refresh">刷新</button>
  <button class="btn" id="btn-run">跑一轮</button>
  <button class="btn-primary" id="btn-new">+ 新建任务</button>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div class="board" id="board"></div>
</main>

<dialog id="dlg-new">
  <div class="dhead"><h2 style="font-size:15px">新建任务</h2><div class="spacer"></div>
    <span class="sub">说清「要什么」就行，其余默认</span></div>
  <div class="dbody">
    <label>标题（一句话说做什么）</label>
    <input id="f-title" placeholder="例：给 README 加常见问题" style="width:100%">
    <label>目标（什么样算做完）</label>
    <textarea id="f-goal" rows="2" style="height:66px" placeholder="例：回答三个新手问题，每条不超过两句"></textarea>
    <div class="row">
      <div><label>产出文件路径</label><input id="f-deliv" placeholder="board/artifacts/xxx.md" style="width:100%"></div>
      <div><label>必须包含的字眼</label><input id="f-accept" placeholder="例：常见问题" style="width:100%"></div>
    </div>
    <div class="row">
      <div><label>引擎</label><select id="f-engine" style="width:100%">
        <option value="">用项目默认</option><option>opencode</option><option>qoderclicn</option></select></div>
      <div><label>模型（留空=默认）</label><input id="f-model" style="width:100%"></div>
      <div><label>思考强度</label><select id="f-effort" style="width:100%">
        <option value="">默认</option><option>low</option><option>medium</option>
        <option>high</option><option>max</option></select></div>
    </div>
    <div class="row">
      <div><label>花费上限（美元，留空=不限）</label><input id="f-maxcost" placeholder="例：2.0" style="width:100%"></div>
      <div><label>时长上限（分钟，留空=不限）</label><input id="f-maxmin" placeholder="例：40" style="width:100%"></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:16px">
      <input type="checkbox" id="f-gate" style="width:auto" checked>
      必须我拍板才算完成
    </label>
    <div class="hint">勾上后：agent 做完会停在「等你拍板」，你看一眼再决定批准或驳回。</div>
  </div>
  <div class="dfoot">
    <button class="btn" onclick="dlgNew.close()">取消</button>
    <button class="btn-primary" id="btn-create">创建</button>
  </div>
</dialog>

<dialog id="dlg-card">
  <div class="dhead"><h2 style="font-size:15px" id="c-title">—</h2><div class="spacer"></div>
    <span class="pill" id="c-state">—</span></div>
  <div class="dbody" id="c-body"></div>
  <div class="dfoot" id="c-foot"></div>
</dialog>

<dialog id="dlg-run">
  <div class="dhead"><h2 style="font-size:15px">跑一轮</h2><div class="spacer"></div>
    <span class="sub" id="run-state"></span></div>
  <div class="dbody">
    <div class="row">
      <div><label>最多处理几张</label><input id="f-max" type="number" value="3" min="1" max="20" style="width:100%"></div>
      <div><label>引擎</label><select id="f-run-engine" style="width:100%">
        <option>opencode</option><option>qoderclicn</option></select></div>
    </div>
    <div class="hint">它会自己找活、执行、复核、返工；需要你拍板的会停下等你。</div>
    <label>运行输出</label>
    <div class="log" id="run-log">（还没开始）</div>
  </div>
  <div class="dfoot">
    <button class="btn" onclick="dlgRun.close()">关闭</button>
    <button class="btn-primary" id="btn-run-start">开始</button>
  </div>
</dialog>

<dialog id="dlg-msg">
  <div class="dhead"><h2 style="font-size:15px">留言</h2>
    <span class="sub">跨会话传话：存住就存住，唤不醒会说唤不醒</span>
    <div class="spacer"></div>
    <input id="msg-as" placeholder="以谁的身份" style="width:120px" title="你是哪个席号">
  </div>
  <div class="dbody">
    <div class="msglist" id="msg-list"><div class="empty">—</div></div>
    <div class="row">
      <div><label>发给</label><input id="msg-to" placeholder="w1 / b1 / human" style="width:100%"></div>
      <div><label>回复哪条（可选）</label><input id="msg-reply" placeholder="留言号，如 12" style="width:100%"></div>
    </div>
    <label>正文</label>
    <textarea id="msg-body" placeholder="一句话说清要对方做什么；需要它回话就把问题写明"></textarea>
    <div class="hint">对方下次干活前跑 <code>board msg inbox --as 席号</code> 就能看到；
      想让它在自己的会话里当场接着答，发送时要带会话号（命令行 <code>--wake-session</code>）。</div>
  </div>
  <div class="dfoot">
    <button class="btn" id="btn-msg-refresh">刷新</button>
    <button class="btn" onclick="dlgMsg.close()">关闭</button>
    <button class="btn-primary" id="btn-msg-send">发送</button>
  </div>
</dialog>

<section class="term hide" id="term">
  <div class="thead">
    <b>终端</b><span class="sub" id="term-state">空闲</span>
    <div class="spacer"></div>
    <button class="btn" data-cmd="board stats">状态</button>
    <button class="btn" data-cmd="board all">全部项目</button>
    <button class="btn" data-cmd="check --quick">自检</button>
    <button class="btn" data-cmd="orch run --max 1">跑一张</button>
    <button class="btn" id="term-clear">清屏</button>
    <button class="btn" id="term-close">收起</button>
  </div>
  <pre class="tout" id="term-out"></pre>
  <div class="tin"><span class="ps">❯</span>
    <input id="term-in" placeholder="board ls ｜ board msg inbox --as w1 ｜ check --quick（↑ ↓ 翻历史）"></div>
</section>

<div class="toast" id="toast"></div>

<div class="selbar hide" id="selbar">
  <b id="sel-n">0</b><span>张已选</span>
  <div class="spacer"></div>
  <button class="btn" id="sel-clear">清空</button>
  <button class="btn" id="sel-cancel">取消这些卡</button>
  <button class="btn-primary" id="sel-run">跑一轮</button>
</div>

<script>
const $ = id => document.getElementById(id);
const STATE_ORDER = ["待认领","进行中","待返工","阻塞","待验收","核验中","拍板中","完成"];
let CUR = {project:null, cards:[], state:null};
let FILTER = null;            // 顶部状态筛选：null＝全部（只画有卡的列，见 render）
let SEARCH = "";              // 搜卡关键词（卡号 / 标题 / 目标）
let SORT = localStorage.getItem("board.sort") || "activity";   // 列内排序
const SEL = new Set();        // 多选的卡号（批量跑 / 批量取消）

function ago(ms){
  if(!ms) return "";
  const d = Date.now() - ms;
  if(d < 60000) return "刚刚";
  if(d < 3600000) return Math.floor(d/60000) + " 分钟前";
  if(d < 86400000) return Math.floor(d/3600000) + " 小时前";
  return Math.floor(d/86400000) + " 天前";
}

function agoHtml(c){
  if(!c.last_at) return "";
  const stale = (Date.now() - c.last_at) > 12 * 3600 * 1000;   // 半天没动＝该看一眼
  return `<span class="${stale ? "ago stale" : "ago"}"
      title="最后活动：${new Date(c.last_at).toLocaleString()}">${ago(c.last_at)}</span>`;
}

function matchesSearch(c, kw){
  if(!kw) return true;
  return (c.id + " " + (c.title || "") + " " + (c.goal || "")).toLowerCase().indexOf(kw) >= 0;
}

function sortList(list){
  const c = list.slice();
  const bg = x => x.budget || {};
  if(SORT === "cost") c.sort((a,b) => (bg(b).cost||0) - (bg(a).cost||0));
  else if(SORT === "minutes") c.sort((a,b) => (bg(b).minutes||0) - (bg(a).minutes||0));
  else if(SORT === "id") c.sort((a,b) => String(a.id).localeCompare(String(b.id)));
  else c.sort((a,b) => (b.last_at||0) - (a.last_at||0));
  return c;
}

function updateSelBar(){
  const n = SEL.size;
  $("sel-n").textContent = n;
  $("selbar").classList.toggle("hide", n === 0);
  document.querySelectorAll(".card").forEach(el =>
    el.classList.toggle("sel", SEL.has(el.dataset.id)));
}
let pollTimer = null;

function toast(msg, isErr){
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.className = "toast"; }, 3600);
}

const BOARD_TOKEN = (document.querySelector('meta[name="board-token"]') || {}).content || "";

async function api(path, opt){
  opt = opt || {};
  const method = (opt.method || "GET").toUpperCase();
  if(method !== "GET"){
    // 会话令牌：跨站页面读不到这个 meta，也就伪造不了写请求（服务端强制校验）
    opt.headers = Object.assign({}, opt.headers, {"X-Board-Token": BOARD_TOKEN});
  }
  const r = await fetch(path, opt);
  const j = await r.json().catch(()=>({error:"返回不是 JSON"}));
  if(!r.ok) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}

function statCards(cards){
  const c = {};
  cards.forEach(x => c[x.state] = (c[x.state]||0) + 1);
  const items = [
    ["全部", cards.length],
    ["进行中", c["进行中"]||0],
    ["待拍板", c["拍板中"]||0],
    ["待验收", (c["待验收"]||0)+(c["核验中"]||0)],
    ["完成", c["完成"]||0],
  ];
  $("stats").innerHTML = items.map(([k,v]) =>
    `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
  // 下拉里的张数用刚拿到的实时数，别用后端 15 秒缓存的那份
  const sel = $("proj");
  const opt = sel.options[sel.selectedIndex];
  if(opt) opt.textContent = `${CUR.project}（${cards.length}）`;
}

function cardHtml(c){
  const tags = [];
  if(c.project) tags.push(`<span class="tag proj">${esc(c.project)}</span>`);
  if(c.engine && c.engine!=="any") tags.push(`<span class="tag">${c.engine}</span>`);
  if(c.model && c.model!=="any") tags.push(`<span class="tag">${String(c.model).split('/').pop()}</span>`);
  if(c.human_gate && c.human_gate!=="none") tags.push(`<span class="tag gate">需你拍板</span>`);
  if(c.rework) tags.push(`<span class="tag rw">返工 ${c.rework}</span>`);
  if(c.created_kind==="agent") tags.push(`<span class="tag ai">AI 发布</span>`);
  if(c.usage && c.usage.available) tags.push(`<span class="tag cost">$${c.usage.cost.toFixed(4)}</span>`);
  // 预算：有上限才显示（没设上限的卡不占地方）
  const bg = c.budget || {};
  if(bg.max_cost != null || bg.max_minutes != null){
    const parts = [];
    if(bg.max_cost != null) parts.push(`$${bg.cost.toFixed(2)}/$${Number(bg.max_cost).toFixed(2)}`);
    if(bg.max_minutes != null) parts.push(`${bg.minutes}/${bg.max_minutes}分`);
    tags.push(`<span class="tag ${bg.over?'rw':'cost'}">${parts.join(" ")}</span>`);
  } else if(bg.minutes > 0){
    // 没设上限时也把时长露出来：按「时长」排序时不然看不出凭什么排的
    tags.push(`<span class="tag">${bg.minutes} 分</span>`);
  }
  if(c.blocked_by && c.blocked_by.length) tags.push(`<span class="tag">依赖 ${c.blocked_by.length}</span>`);
  const cs = c.consult || {};
  if(cs.seats && cs.seats.length) tags.push(`<span class="tag">评审 ${cs.seats.length}</span>`);
  if(cs.unfixed > 0) tags.push(`<span class="tag rw">未改 ${cs.unfixed}</span>`);
  else if(cs.unfixed === -1) tags.push(`<span class="tag rw">未改?</span>`);
  const blk = c.blocked_reason ? `<div class="g" style="color:#d9a441">${esc(c.blocked_reason).slice(0,60)}</div>` : "";
  return `<div class="card ${SEL.has(c.id)?"sel":""}" data-id="${esc(c.id)}">
    <input type="checkbox" class="pick" data-pick="${esc(c.id)}" ${SEL.has(c.id)?"checked":""}
           title="选中这张（可以批量跑 / 批量取消）">
    <div class="id">${esc(c.id)}${agoHtml(c)}</div>
    <div class="t">${esc(c.title)}</div>
    ${c.goal?`<div class="g">${esc(c.goal)}</div>`:""}
    ${blk}
    <div class="tags">${tags.join("")}</div>
  </div>`;
}

function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

// 长字段（凭据/目标/阻塞原因）先折叠：一整段凭据会把实时输出挤到折叠线以下
function kvHtml(k, v){
  const t = String(v ?? "");
  if(t.length <= 140) return `<dt>${k}</dt><dd>${esc(t)}</dd>`;
  return `<dt>${k}</dt><dd><span class="foldpre">${esc(t.slice(0,110))}…</span>` +
         `<span class="foldfull" style="display:none">${esc(t)}</span>` +
         `<button class="foldbtn" type="button" title="展开/收起">展开全文 ${t.length} 字</button></dd>`;
}

function render(cards){
  const CAP = 60;              // 每列最多画这么多张，几十个项目时不至于把浏览器卡死
  const kw = (SEARCH || "").trim().toLowerCase();
  if(kw) cards = cards.filter(c => matchesSearch(c, kw));
  const by = {};
  STATE_ORDER.forEach(s => by[s]=[]);
  cards.forEach(c => (by[c.state] || (by[c.state]=[])).push(c));

  // 顶部筛选条（点一下只看那一种状态；再点「全部」回来）
  $("filters").innerHTML =
    [(kw ? `<span class="chip on" style="cursor:default">搜到 ${cards.length} 张</span>` : ""),
     `<button class="chip ${FILTER?"":"on"}" data-f="">全部 <em>${cards.length}</em></button>`]
      .concat(STATE_ORDER.map(s =>
        `<button class="chip ${FILTER===s?"on":""}" data-f="${s}">${s} <em>${(by[s]||[]).length}</em></button>`))
      .join("");
  $("filters").querySelectorAll(".chip[data-f]").forEach(el => {
    el.onclick = () => { FILTER = el.dataset.f || null; render(CUR.cards || cards); };
  });

  // ⚠️ 只画**有卡的列**：8 列 × 268px 在 1360px 窗口里放不下，
  //    以前靠横向滚动，「拍板中」默认在屏幕外——要人拖着找，等于藏起来了。
  const cols = FILTER ? [FILTER] : STATE_ORDER.filter(s => (by[s] || []).length);
  if(!cols.length){
    $("board").innerHTML = '<div class="empty" style="padding:36px;font-size:13px">还没有卡 —— 点右上角「新建任务」</div>';
    return;
  }
  $("board").innerHTML = cols.map(s => {
    // 列内排序：最近活动（默认）／花费／时长／卡号
    const list = sortList(by[s]||[]);
    let inner = '<div class="empty">—</div>';
    if(list.length){
      inner = list.slice(0, CAP).map(cardHtml).join("");
      if(list.length > CAP)
        inner += `<div class="empty">还有 ${list.length - CAP} 张 —— 选具体项目看全部</div>`;
    }
    return `<div class="col"><h2>${s}<em>${list.length}</em></h2><div class="list">${inner}</div></div>`;
  }).join("");
  document.querySelectorAll(".card").forEach(el =>
    el.addEventListener("click", ()=>openCard(el.dataset.id)));
  document.querySelectorAll(".pick").forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();          // 别让勾选顺手把详情打开
      if(el.checked) SEL.add(el.dataset.pick); else SEL.delete(el.dataset.pick);
      updateSelBar();
    };
  });
  updateSelBar();
}

async function refresh(){
  try{
    await loadState();
    const d = await api("/api/cards" + q());
    CUR.cards = d.cards;
    // 选中的卡可能已经不在当前项目/已被删：剪掉，否则「已选 3 张」里有一张是鬼
    const alive = new Set(d.cards.map(c => c.id));
    [...SEL].forEach(x => { if(!alive.has(x)) SEL.delete(x); });
    statCards(d.cards);
    render(d.cards);
  }catch(e){ toast("刷新失败："+e.message, true); }
}

function startPoll(){
  if(pollTimer) clearInterval(pollTimer);
  // 全部项目总览要扫几十个库，刷新别太勤
  const ms = CUR.project === "__all__" ? 15000 : 5000;
  pollTimer = setInterval(()=>{ if(!document.querySelector("dialog[open]")) refresh(); }, ms);
}

function projOf(id){
  const c = (CUR.cards||[]).find(x => x.id === id);
  return (c && c.project_path) || CUR.project;
}

async function openCard(id){
  try{
    const proj = projOf(id);
    const c = await api("/api/card?project=" + encodeURIComponent(proj) +
                        "&id=" + encodeURIComponent(id));
    $("c-title").textContent = c.title;
    $("c-state").textContent = c.state;
    const kv = [];
    kv.push(["编号", c.id]);
    if(c.evidence_tier){
      const tier = {VERIFIED:"已验证", "AUDITED-UNGROUNDED":"仅复核（未接地）", UNVERIFIED:"未验证"}[c.evidence_tier] || c.evidence_tier;
      kv.push(["证据层级", tier + "（" + c.evidence_tier + "）"]);
    }
    if(c.goal) kv.push(["目标", c.goal]);
    if(c.holder) kv.push(["当前执行", c.holder]);
    if(c.deliverables && c.deliverables.length) kv.push(["产出", c.deliverables.join("、")]);
    if(c.review_verdict) kv.push(["复核", `${c.review_verdict}（${c.review_seat}）`]);
    if(c.consult && c.consult.seats && c.consult.seats.length){
      const line = c.consult.seats
        .map(x => `${x.seat}·${x.model || x.seat} ${x.verdict || "?"} ${x.problems}条`)
        .join(" ｜ ");
      const u = c.consult.unfixed;
      const tail = u === -1 ? " → 改后未改：未知"
                 : (u == null ? "" : ` → 改后剩 ${u} 条未改`);
      kv.push(["评审", line + tail]);
    }
    if(c.review_evidence) kv.push(["凭据", c.review_evidence]);
    if(c.gate_problems && c.gate_problems.length) kv.push(["未过项", c.gate_problems.join("；")]);
    if(c.usage && c.usage.available)
      kv.push(["花费", `$${c.usage.cost.toFixed(4)}（入 ${c.usage.input} / 出 ${c.usage.output} / 缓存 ${c.usage.cache_read+c.usage.cache_write}）`]);
    const bg = c.budget || {};
    if(bg.max_cost != null || bg.max_minutes != null){
      const lim = [];
      if(bg.max_cost != null) lim.push(`$${Number(bg.max_cost).toFixed(2)}`);
      if(bg.max_minutes != null) lim.push(`${bg.max_minutes} 分钟`);
      kv.push(["预算", `${bg.over?"⚠ 已超：":""}$${bg.cost.toFixed(4)} / ${bg.minutes} 分钟（上限 ${lim.join(" / ")}）`]);
    }
    if(c.blocked_by && c.blocked_by.length) kv.push(["依赖", c.blocked_by.join("、")]);
    if(c.blocked_reason) kv.push(["阻塞", c.blocked_reason]);

    // B4：认领前 → 现在（人不用自己跑 git diff）
    const diff = c.diff || [];
    const diffHtml = diff.length ? `<label>这次改了什么</label><div class="difflist">` +
      diff.map(d => {
        const cls = {"新增":"ok","改了":"chg","没动":"same","没了":"bad","缺件":"bad","新件":"ok"}[d.status] || "same";
        const b = d.before.exists ? `${d.before.bytes}B` : "-";
        const a = d.after.exists ? `${d.after.bytes}B` : "-";
        return `<div class="diffrow ${cls}"><b>${esc(d.status)}</b> <code>${esc(d.path)}</code>
                <span>${b} → ${a}</span></div>`;
      }).join("") + `</div>` : "";

    const live = ["进行中", "核验中"].includes(c.state);
    const hasLog = (c.log_bytes || 0) > 0;
    const logHtml = (live || hasLog)
      ? `<label>实时输出 <span style="font-weight:400;color:#6c7683">${
           live ? "（正在跑，1.5 秒刷新）" : "（最后一轮的输出）"}</span></label>
         <pre class="clog" id="c-log">—</pre>` : "";

    const events = (c.events||[]).map(e =>
      `<div class="ev"><b>${e.type}</b> <span style="color:#6c7683">${e.seq} · ${(e.at||"").slice(11,19)}</span>
        ${e.seat?` · ${esc(e.seat)}`:""}
        ${e.verdict?` · ${e.verdict}`:""}
        ${e.note?`<br>${esc(e.note).slice(0,200)}`:""}
        ${e.evidence?`<br><span style="color:#6c7683">${esc(e.evidence).slice(0,180)}</span>`:""}
      </div>`).join("");

    $("c-body").innerHTML = `<dl class="kv">` +
      kv.map(([k,v])=>kvHtml(k,v)).join("") + `</dl>
      ${logHtml}
      ${diffHtml}
      <label>经过</label>${events || '<div class="empty">—</div>'}`;

    // 长字段展开/收起（默认收起：凭据一整段，会把下面的实时输出挤出视野）
    document.querySelectorAll(".foldbtn").forEach(b => {
      b.onclick = () => {
        const dd = b.parentElement;
        const pre = dd.querySelector(".foldpre"), full = dd.querySelector(".foldfull");
        const opened = full.style.display !== "none";
        full.style.display = opened ? "none" : "inline";
        pre.style.display = opened ? "inline" : "none";
        b.textContent = opened ? `展开全文 ${full.textContent.length} 字` : "收起";
      };
    });

    // 实时输出：在卡片里直接看，不用另开窗口（跑的时候 1.5 秒刷一次）
    cardLogId = (live || hasLog) ? c.id : null;
    cardLogSize = 0;
    if(cardLogTimer){ clearInterval(cardLogTimer); cardLogTimer = null; }
    if(cardLogId){
      pollCardLog();
      if(live) cardLogTimer = setInterval(pollCardLog, 1500);
    }

    const foot = [];
    if(c.state === "拍板中"){
      foot.push(`<input id="reject-note" placeholder="驳回理由（会传给下一轮）" style="flex:1;min-width:200px">`);
      foot.push(`<button class="btn-err" id="btn-reject">驳回</button>`);
      foot.push(`<button class="btn-ok" id="btn-approve">批准</button>`);
    }
    foot.push(`<button class="btn" onclick="dlgCard.close()">关闭</button>`);
    $("c-foot").innerHTML = foot.join("");
    if(c.state === "拍板中"){
      $("btn-approve").onclick = () => human(c.id, "approve", "");
      $("btn-reject").onclick = () => {
        const n = ($("reject-note").value||"").trim();
        if(!n) return toast("驳回要写理由", true);
        human(c.id, "reject", n);
      };
    }
    dlgCard.showModal();
  }catch(e){ toast("打开失败："+e.message, true); }
}

async function human(id, decision, note){

    refresh();
  }catch(e){
    toast(e.message, true);
  }
}

/* ---------- 实时输出（卡片详情里看，不用另开窗口）---------- */
let cardLogTimer = null, cardLogSize = 0, cardLogId = null;

async function pollCardLog(){
  if(!cardLogId) return;
  const el = $("c-log");
  if(!el) return;
  try{
    const r = await api(`/api/card/log?project=${encodeURIComponent(projOf(cardLogId) || "")}` +
                        `&id=${encodeURIComponent(cardLogId)}&since=${cardLogSize}`);
    if(r.size < cardLogSize){ el.textContent = ""; cardLogSize = 0; }   // 新一轮把文件清空了
    if(r.log){
      if(el.textContent === "—") el.textContent = "";
      el.textContent += r.log;
      el.scrollTop = el.scrollHeight;
    }
    cardLogSize = r.size;
    if(!r.running && cardLogTimer){ clearInterval(cardLogTimer); cardLogTimer = null; }
  }catch(e){ /* 网络抖一下不打断看卡 */ }
}

async function loadMsgs(){

    setBadge(d.unread && d.unread[MSG_AS] || 0);
    const list = (d.messages||[]).slice().reverse();
    if(!list.length){ $("msg-list").innerHTML = '<div class="empty">还没有留言</div>'; return; }
    $("msg-list").innerHTML = list.map(m => `
      <div class="msg ${m.unread?"unread":""}">
        <div class="mh"><b>#${m.seq}</b> ${esc(m.sender)} → ${esc(m.recipient)}
          ${m.reply_to?`<span>↳#${m.reply_to}</span>`:""}
          ${m.wake?`<span class="wake">${esc(m.wake)}</span>`:""}
          <span style="margin-left:auto">${esc((m.at||"").slice(5,16))}</span>
          ${m.unread?`<span class="ma" data-ack="${m.seq}">标已读</span>`:""}
        </div>
        <div class="mb">${esc(m.body).slice(0,700)}</div>
      </div>`).join("");
    document.querySelectorAll("[data-ack]").forEach(el =>
      el.onclick = async () => {
        try{
          await api("/api/messages/ack", {method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({project: CUR.project, seq: Number(el.dataset.ack), as: MSG_AS})});
          loadMsgs();
        }catch(e){ toast(e.message, true); }
      });
    document.querySelectorAll(".msg").forEach(el =>
      el.onclick = e => {
        if(e.target.dataset.ack) return;
        const no = el.querySelector(".mh b").textContent.replace("#","");
        $("msg-reply").value = no;
      });
  }catch(e){ toast("读留言失败：" + e.message, true); }
}

$("btn-msg").onclick = () => { dlgMsg.showModal(); loadMsgs(); };
$("btn-msg-refresh").onclick = loadMsgs;
$("btn-msg-send").onclick = async () => {
  const to = ($("msg-to").value||"").trim();
  const body = ($("msg-body").value||"").trim();
  if(!to) return toast("要写发给谁", true);
  if(!body) return toast("正文空了", true);
  try{
    const r = await api("/api/messages", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({project: CUR.project, from: MSG_AS, to, body,
                            reply_to: $("msg-reply").value ? Number($("msg-reply").value) : null})});
    $("msg-body").value = ""; $("msg-reply").value = "";
    toast("已存为 #" + r.message.seq + "（对方下次干活跑 inbox 就能看到）");
    loadMsgs();
  }catch(e){ toast(e.message, true); }
};

async function pollBadge(){
  if(dlgMsg.open){ await loadMsgs(); return; }
  try{
    const d = await api("/api/messages" + q() + "&as=" + encodeURIComponent(MSG_AS) + "&limit=1");
    setBadge(d.unread && d.unread[MSG_AS] || 0);
  }catch(e){}
}

/* ---------- 内置终端 ---------- */
let TERM_SINCE = 0, termTimer = null, termRunning = false, MSG_TERM_OPEN = false;
const HISTORY = []; let histPos = -1;

function termEl(){ return $("term-out"); }
function termAppend(l){
  const out = termEl();
  const near = out.scrollTop + out.clientHeight >= out.scrollHeight - 40;
  const span = document.createElement("span");
  span.className = l.kind || "out";
  span.textContent = l.text + "\n";
  out.appendChild(span);
  if(near) out.scrollTop = out.scrollHeight;
}
async function termPoll(){
  try{
    const d = await api("/api/term/tail?since=" + TERM_SINCE);
    (d.lines||[]).forEach(termAppend);
    TERM_SINCE = d.next || TERM_SINCE;
    termRunning = !!d.running;
    $("term-state").textContent = d.running ? "运行中… " + (d.cmd||"") :
      (d.rc == null ? "空闲" : "上一条退出码 " + d.rc);
    if(!d.running && !MSG_TERM_OPEN) stopTermPoll();
  }catch(e){}
}
function startTermPoll(){ if(!termTimer) termTimer = setInterval(termPoll, 600); }
function stopTermPoll(){ if(termTimer){ clearInterval(termTimer); termTimer = null; } }
function termToggle(force){
  const el = $("term");
  const open = force != null ? force : el.classList.contains("hide");
  el.classList.toggle("hide", !open);
  document.body.classList.toggle("term-on", open);
  MSG_TERM_OPEN = open;
  if(open){ startTermPoll(); termPoll(); $("term-in").focus(); }
  else if(!termRunning) stopTermPoll();
}
async function termRun(cmd){
  cmd = (cmd||"").trim();
  if(!cmd) return;
  HISTORY.push(cmd); histPos = HISTORY.length;
  $("term-in").value = "";
  try{
    await api("/api/term/run", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({project: CUR.project === "__all__" ? null : CUR.project, cmd})});
    startTermPoll();
  }catch(e){ termAppend({kind:"err", text:"✗ " + e.message}); }
}
$("btn-term").onclick = () => termToggle();
$("term-close").onclick = () => termToggle(false);
$("term-clear").onclick = () => { termEl().innerHTML = ""; };
document.querySelectorAll("#term [data-cmd]").forEach(b =>
  b.onclick = () => { termToggle(true); termRun(b.dataset.cmd); });
$("term-in").onkeydown = e => {
  if(e.key === "Enter"){ termRun($("term-in").value); }
  else if(e.key === "ArrowUp" && HISTORY.length){
    histPos = Math.max(0, histPos - 1); $("term-in").value = HISTORY[histPos] || "";
    e.preventDefault();
  }
  else if(e.key === "ArrowDown" && HISTORY.length){
    histPos = Math.min(HISTORY.length, histPos + 1);
    $("term-in").value = HISTORY[histPos] || "";
    e.preventDefault();
  }
};
document.addEventListener("keydown", e => {
  if(e.ctrlKey && (e.key === "`" || e.code === "Backquote")){ e.preventDefault(); termToggle(); }
});

refresh().then(startPoll);
setInterval(pollBadge, 10000);
pollBadge();

// 截图/演示用：?term=1 直接把终端拉起来（也方便你对着一张图看它在哪）
//   ?term=1&cmd=board+stats 会顺手跑一条（照样走白名单，跑不了的还是跑不了）
if(location.search.indexOf("term=1") >= 0) termToggle(true);
const demoCmd = (location.search.match(/[?&]cmd=([^&]+)/) || [])[1];
if(demoCmd) termRun(decodeURIComponent(demoCmd.replace(/\+/g, " ")));

// 深链接：?open=<卡号> 直接打开那张卡的详情（"你看下 C123" 甩个链接就能点到同一个界面）
//   ?new=1 直接弹出新建对话框（截图/演示也靠它，省得用鼠标点）
const openId = (location.search.match(/[?&]open=([^&]+)/) || [])[1];
if(openId) refresh().then(() => openCard(decodeURIComponent(openId)));
if(location.search.indexOf("new=1") >= 0) setTimeout(() => dlgNew.showModal(), 300);
</script>
